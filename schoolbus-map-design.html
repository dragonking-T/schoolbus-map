 main.map { grid-column:2; grid-row:2; position:relative; overflow:hidden; background:#10233a; min-width:0; min-height:0; }
 #map { position:relative; display:block; width:100%; height:100%; min-height:420px; z-index:1; }

    .route-head { display:grid; grid-template-columns: 28px 1fr auto; align-items:center; gap:10px; }
    .route-check { width:18px; height:18px; accent-color: var(--blue); cursor:pointer; }
    .route-name { display:flex; align-items:center; gap:10px; font-weight:800; min-width:0; }

    .dot { width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 4px rgba(255,255,255,.06); flex:none; }
    .meta { margin-top:8px; color:var(--muted); font-size:12px; display:flex; justify-content:space-between; }
    .legend-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
    .legend-item { border:1px solid var(--line); border-radius:12px; padding:8px; font-size:12px; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.04); }

    .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0; }
    .stat { border:1px solid var(--line); border-radius:16px; padding:12px; background:rgba(255,255,255,.05); }
    .stat b { display:block; font-size:18px; } .stat span { color:var(--muted); font-size:12px; }
    .stop-list { display:flex; flex-direction:column; gap:0; border:1px solid var(--line); border-radius:18px; overflow:hidden; }
    .stop { display:grid; grid-template-columns:45px 58px 1fr; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.04); align-items:center; cursor:pointer; }
    .stop:hover { background:rgba(255,255,255,.09); }
    .stop:last-child { border-bottom:0; }
    .idx { width:26px; height:26px; border-radius:10px; display:grid; place-items:center; font-size:12px; font-weight:900; color:#06111f; }
    .time { font-weight:800; color:#fff; font-variant-numeric:tabular-nums; }
    .place { color:#d9e8ff; font-size:13px; line-height:1.35; }
    .timeline h3 { margin:0 0 13px; font-size:14px; color:#d9e8ff; }
    .timebar { position:relative; height:56px; border-radius:18px; background:rgba(255,255,255,.06); border:1px solid var(--line); overflow:hidden; }
    .tick { position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.16); }

    .annotation { margin-top:12px; color:var(--muted); font-size:12px; }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#07111f; color:#f7fbff; border:1px solid rgba(255,255,255,.14); }

].map(route => ({...route, stops: route.stops.map((s, index) => ({order:index + 1, time:s[0], name:s[1], lat:s[2], lng:s[3]}))}));

const mapSvg = document.getElementById('map');
let selectedRouteId = 1;
let visibleRoutes = new Set(routes.map(r => r.id));
const bounds = { minLng:114.115, maxLng:114.285, minLat:22.235, maxLat:22.330 };
function x(lng) { return ((lng - bounds.minLng) / (bounds.maxLng - bounds.minLng)) * 1000; }
function y(lat) { return 640 - ((lat - bounds.minLat) / (bounds.maxLat - bounds.minLat)) * 640; }
function p(lat,lng){ return `${x(lng).toFixed(1)},${y(lat).toFixed(1)}`; }
function esc(str){ return String(str).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function minutes(t) { const [h,m] = t.split(':').map(Number); return h * 60 + m; }
function duration(start, end) { return `${minutes(end) - minutes(start)}分`; }
function centroid(points){ const xs=points.map(q=>x(q[1])), ys=points.map(q=>y(q[0])); return [xs.reduce((a,b)=>a+b,0)/xs.length, ys.reduce((a,b)=>a+b,0)/ys.length]; }
function linePoints(route){ return [p(school.lat, school.lng), ...route.stops.map(s => p(s.lat,s.lng))].join(' '); }

const LAND = [
 {name:'香港島', pts:[[22.286,114.125],[22.293,114.145],[22.291,114.178],[22.288,114.210],[22.282,114.242],[22.270,114.257],[22.253,114.247],[22.242,114.218],[22.236,114.185],[22.241,114.153],[22.258,114.130]]},
 {name:'九龍', pts:[[22.304,114.145],[22.323,114.166],[22.326,114.205],[22.318,114.232],[22.301,114.225],[22.294,114.195],[22.296,114.162]]},
 {name:'將軍澳', pts:[[22.321,114.242],[22.330,114.258],[22.322,114.278],[22.302,114.280],[22.289,114.268],[22.299,114.250]]},
 {name:'鴨脷洲', pts:[[22.248,114.143],[22.249,114.158],[22.242,114.163],[22.236,114.148]]}
];
const ROADS = [
 [[22.286,114.126],[22.286,114.150],[22.286,114.180],[22.287,114.210],[22.280,114.235],[22.276,114.250]],
 [[22.281,114.130],[22.282,114.150],[22.278,114.172],[22.276,114.190],[22.282,114.216],[22.279,114.232]],
 [[22.306,114.148],[22.312,114.170],[22.314,114.198],[22.309,114.228],[22.316,114.260]],
 [[22.252,114.129],[22.260,114.135],[22.267,114.142],[22.280,114.150],[22.286,114.158]],
 [[22.306,114.258],[22.296,114.268],[22.291,114.274]]
];
const LABELS = [
 ['中環',22.284,114.158],['灣仔',22.276,114.174],['銅鑼灣',22.280,114.184],['北角',22.291,114.199],['太古城',22.286,114.217],['柴灣',22.266,114.237],['薄扶林',22.260,114.132],['香港仔',22.247,114.153],['觀塘',22.312,114.226],['將軍澳',22.308,114.262],['日出康城',22.295,114.269]
];

function drawMap(){
 let html = `<defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.25"/></filter></defs>`;
 html += `<rect x="0" y="0" width="1000" height="640" fill="#d9ecf7"/>`;
 html += `<text x="70" y="95" fill="rgba(40,73,100,.22)" font-size="42" font-weight="900" letter-spacing="8">HONG KONG OFFLINE MAP</text>`;
 LAND.forEach(area => {
 html += `<polygon points="${area.pts.map(q=>p(q[0],q[1])).join(' ')}" fill="#eef3e8" stroke="#b4c5b5" stroke-width="2"/>`;
 const [cx,cy]=centroid(area.pts); html += `<text x="${cx}" y="${cy}" text-anchor="middle" fill="#6f826f" font-size="18" font-weight="800">${area.name}</text>`;
 });
 ROADS.forEach(road => html += `<polyline points="${road.map(q=>p(q[0],q[1])).join(' ')}" fill="none" stroke="#ffffff" stroke-width="9" opacity=".8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${road.map(q=>p(q[0],q[1])).join(' ')}" fill="none" stroke="#c9d3dd" stroke-width="2" opacity=".9" stroke-linecap="round" stroke-linejoin="round"/>`);
 LABELS.forEach(([name,lat,lng]) => html += `<text x="${x(lng)}" y="${y(lat)}" fill="#41566d" font-size="13" font-weight="700">${name}</text>`);
 routes.forEach(route => {
 const display = visibleRoutes.has(route.id) ? '' : 'display="none"';
 const selected = route.id === selectedRouteId;
 html += `<g data-route-layer="${route.id}" ${display}>`;
 html += `<polyline points="${linePoints(route)}" fill="none" stroke="#fff" stroke-width="${selected?15:11}" opacity=".72" stroke-linecap="round" stroke-linejoin="round"/>`;
 html += `<polyline class="route-svg-line" data-route-id="${route.id}" points="${linePoints(route)}" fill="none" stroke="${route.color}" stroke-width="${selected?8:5}" opacity="${selected?1:.9}" stroke-linecap="round" stroke-linejoin="round"/>`;
 route.stops.forEach(stop => {
 const isEnd = stop.order === route.stops.length;
 html += `<g class="stop-svg" data-stop-route="${route.id}" data-stop-order="${stop.order}" transform="translate(${x(stop.lng).toFixed(1)} ${y(stop.lat).toFixed(1)})"><circle r="${isEnd?10:7}" fill="${route.color}" stroke="#fff" stroke-width="3" filter="url(#shadow)"/><text y="3" text-anchor="middle" font-size="8" font-weight="900" fill="#06111f">${stop.order}</text><title>R${route.id} ${stop.time} ${esc(stop.name)}</title></g>`;
 });
 const end=route.stops[route.stops.length-1];
 html += `<text x="${x(end.lng)+12}" y="${y(end.lat)-10}" fill="#102033" font-size="12" font-weight="900">R${route.id} ${end.time}</text>`;
 html += `</g>`;
 });
 html += `<g transform="translate(${x(school.lng).toFixed(1)} ${y(school.lat).toFixed(1)})"><rect x="-28" y="-22" width="56" height="44" rx="14" fill="#f9c74f" stroke="#fff" stroke-width="4" filter="url(#shadow)"/><text text-anchor="middle" y="5" font-size="15" font-weight="900" fill="#111">學校</text><title>${school.name}</title></g>`;
 html += `<g id="mapTooltip" style="display:none"><rect x="0" y="0" width="260" height="74" rx="12" fill="rgba(7,17,31,.92)" stroke="rgba(255,255,255,.2)"/><text id="tipTitle" x="14" y="25" fill="#fff" font-size="14" font-weight="800"></text><text id="tipSub" x="14" y="50" fill="#bdd0e8" font-size="12"></text></g>`;
 mapSvg.innerHTML = html;
}

const routeList = document.getElementById('routeList');
const legend = document.getElementById('legend');
const stopList = document.getElementById('stopList');
const detailHeader = document.getElementById('detailHeader');
const stats = document.getElementById('stats');
const detailRouteNo = document.getElementById('detailRouteNo');
const visibleCount = document.getElementById('visibleCount');
const modeText = document.getElementById('modeText');
const searchInput = document.getElementById('searchInput');

function renderRouteList(filter = '') {
 routeList.innerHTML = '';
 const q = filter.trim().toLowerCase();
 routes.forEach(route => {
 const searchable = `${route.id} ${route.name} ${route.start} ${route.end} ${route.stops.map(s => `${s.name} ${s.time}`).join(' ')}`.toLowerCase();
 if (q && !searchable.includes(q)) return;
 const checked = visibleRoutes.has(route.id) ? 'checked' : '';
 routeList.insertAdjacentHTML('beforeend', `<div class="route-card ${selectedRouteId === route.id ? 'active' : ''} ${checked ? '' : 'dimmed'}" data-route-id="${route.id}"><div class="route-head"><input class="route-check" type="checkbox" ${checked} data-route-check="${route.id}" /><div class="route-name"><span class="dot" style="background:${route.color}"></span><span>路線 ${route.id}｜${route.name}</span></div><b>${route.stops.length}站</b></div><div class="meta"><span>${route.start} → ${route.end}</span><span>點擊查看 · checkbox 疊加</span></div></div>`);
 });
}
function renderLegend() { legend.innerHTML = ''; routes.forEach(route => legend.insertAdjacentHTML('beforeend', `<div class="legend-item"><span class="dot" style="background:${route.color}"></span>R${route.id}</div>`)); }
function renderDetail(routeId) {
 const route = routes.find(r => r.id === routeId) || routes[0];
 detailHeader.innerHTML = `<div class="big-num" style="background:${route.color}">${route.id}</div><div><h2 style="margin:0">路線 ${route.id}｜${route.name}</h2><div class="subtitle">${route.start} 出發 · ${route.stops.length} 站 · 終點 ${route.end}</div></div>`;
 stats.innerHTML = `<div class="stat"><b>${duration(route.start, route.end)}</b><span>全程</span></div><div class="stat"><b>${route.stops.length}</b><span>站點</span></div><div class="stat"><b>${visibleRoutes.has(route.id) ? '顯示中' : '已隱藏'}</b><span>圖層狀態</span></div>`;
 detailRouteNo.textContent = `路線${route.id}`;
 stopList.innerHTML = '';
 route.stops.forEach(stop => stopList.insertAdjacentHTML('beforeend', `<div class="stop" data-stop-route="${route.id}" data-stop-order="${stop.order}"><div class="idx" style="background:${route.color}">${stop.order}</div><div class="time">${stop.time}</div><div class="place">${stop.name}</div></div>`));
}
function updateVisibleCount() { visibleCount.textContent = `${visibleRoutes.size}/9 已顯示`; modeText.textContent = `模式：${visibleRoutes.size} 條路線疊加顯示 · 離線底圖`; }
function selectRoute(routeId) { selectedRouteId = routeId; renderRouteList(searchInput.value); renderDetail(routeId); drawMap(); bindMapEvents(); }
function setRouteVisibility(routeId, visible) { visible ? visibleRoutes.add(routeId) : visibleRoutes.delete(routeId); renderRouteList(searchInput.value); renderDetail(selectedRouteId); updateVisibleCount(); renderTimeline(); drawMap(); bindMapEvents(); }
function showTooltip(route, stop) {
 const tip = document.getElementById('mapTooltip'), title = document.getElementById('tipTitle'), sub = document.getElementById('tipSub');
 if(!tip) return;
 const tx = Math.min(735, x(stop.lng)+16), ty = Math.max(12, y(stop.lat)-88);
 tip.setAttribute('transform', `translate(${tx} ${ty})`); tip.style.display = 'block';
 title.textContent = `R${route.id}｜${stop.order}. ${stop.name}`; sub.textContent = `時間：${stop.time}`;
}
function bindMapEvents(){
 mapSvg.querySelectorAll('.route-svg-line').forEach(el => el.addEventListener('click', () => selectRoute(Number(el.dataset.routeId))));
 mapSvg.querySelectorAll('.stop-svg').forEach(el => el.addEventListener('click', () => { const route=routes.find(r=>r.id===Number(el.dataset.stopRoute)); const stop=route.stops.find(s=>s.order===Number(el.dataset.stopOrder)); selectRoute(route.id); setTimeout(()=>showTooltip(route, stop),0); }));
}
routeList.addEventListener('click', event => { const checkbox = event.target.closest('[data-route-check]'); if (checkbox) { event.stopPropagation(); setRouteVisibility(Number(checkbox.dataset.routeCheck), checkbox.checked); return; } const card = event.target.closest('[data-route-id]'); if (card) selectRoute(Number(card.dataset.routeId)); });
stopList.addEventListener('click', event => { const row = event.target.closest('[data-stop-order]'); if (!row) return; const route = routes.find(r => r.id === Number(row.dataset.stopRoute)); const stop = route.stops.find(s => s.order === Number(row.dataset.stopOrder)); if (!visibleRoutes.has(route.id)) visibleRoutes.add(route.id); selectRoute(route.id); showTooltip(route, stop); updateVisibleCount(); renderTimeline(); });
searchInput.addEventListener('input', () => renderRouteList(searchInput.value));
document.getElementById('selectAllBtn').addEventListener('click', () => { routes.forEach(r => visibleRoutes.add(r.id)); renderRouteList(searchInput.value); renderDetail(selectedRouteId); updateVisibleCount(); renderTimeline(); drawMap(); bindMapEvents(); });
document.getElementById('clearAllBtn').addEventListener('click', () => { routes.forEach(r => visibleRoutes.delete(r.id)); renderRouteList(searchInput.value); renderDetail(selectedRouteId); updateVisibleCount(); renderTimeline(); drawMap(); bindMapEvents(); });
document.getElementById('fitVisibleBtn').textContent = '顯示全部路線';
document.getElementById('fitVisibleBtn').addEventListener('click', () => { routes.forEach(r => visibleRoutes.add(r.id)); updateVisibleCount(); renderTimeline(); drawMap(); bindMapEvents(); });
document.getElementById('focusSchoolBtn').textContent = '離線地圖';
document.getElementById('focusSchoolBtn').addEventListener('click', () => alert('此版本為完全離線 SVG 香港底圖，不依賴 Leaflet、OSM 或任何外部網絡資源。'));
function timePct(t) { return Math.max(0, Math.min(100, ((minutes(t) - minutes('15:40')) / (minutes('17:07') - minutes('15:40'))) * 100)); }
function renderTimeline() { const tb = document.getElementById('timebar'); tb.innerHTML = ''; ['15:40','16:00','16:20','16:40','17:00'].forEach(t => tb.insertAdjacentHTML('beforeend',`<div class="tick" style="left:${timePct(t)}%"><span>${t}</span></div>`)); routes.forEach((route,i) => { const off = visibleRoutes.has(route.id) ? '' : 'off'; tb.insertAdjacentHTML('beforeend',`<div class="route-chip ${off}" data-timeline-route="${route.id}" title="R${route.id} ${route.start}-${route.end}" style="left:${timePct(route.start)}%;width:${Math.max(3,timePct(route.end)-timePct(route.start))}%;background:${route.color};top:${27+(i%2)*20}px"></div>`); }); }
document.getElementById('timebar').addEventListener('click', event => { const chip = event.target.closest('[data-timeline-route]'); if (chip) selectRoute(Number(chip.dataset.timelineRoute)); });
renderLegend(); renderRouteList(); renderDetail(1); renderTimeline(); updateVisibleCount(); drawMap(); bindMapEvents();
</script>
