const geoCache=JSON.parse(localStorage.getItem('schoolbus.geo.v9')||'{}'),pathCache=JSON.parse(localStorage.getItem('schoolbus.path.v9')||'{}');function saveCaches(){localStorage.setItem('schoolbus.geo.v9',JSON.stringify(geoCache));localStorage.setItem('schoolbus.path.v9',JSON.stringify(pathCache))}function geocodeStop(s){return new Promise(res=>{if(s.lng&&s.lat)return res(s);let h=applyCoord(s.name,s.address);if(h){s.lng=h[0];s.lat=h[1];geoCache[s.address]=[s.lng,s.lat];saveCaches();return res(s)}if(geoCache[s.address]){[s.lng,s.lat]=geoCache[s.address];return res(s)}geocoder.getLocation(s.address,(st,r)=>{let loc=r?.geocodes?.[0]?.location;if(st==='complete'&&loc&&loc.lng>114.05&&loc.lng<114.30&&loc.lat>22.20&&loc.lat<22.35){s.lng=loc.lng;s.lat=loc.lat;geoCache[s.address]=[s.lng,s.lat];saveCaches()}else{s.lng=SCHOOL.lng;s.lat=SCHOOL.lat}res(s)})})}function orderedPoints(r){return mode().schoolRole==='origin'?[SCHOOL,...r.stops]:[...r.stops,SCHOOL]}function drivingSegment(a,b){let k=`${a.lng},${a.lat}|${b.lng},${b.lat}`;if(pathCache[k])return Promise.resolve(pathCache[k]);return new Promise(res=>{driving.search(new AMap.LngLat(a.lng,a.lat),new AMap.LngLat(b.lng,b.lat),(st,r)=>{let path=[];(r?.routes?.[0]?.steps||[]).forEach(step=>(step.path||[]).forEach(pt=>path.push([pt.lng,pt.lat])));if(st==='complete'&&path.length>1){pathCache[k]=path;saveCaches();res(path)}else res([[a.lng,a.lat],[b.lng,b.lat]])})})}async function buildPath(r){await Promise.all(r.stops.map(geocodeStop));let pts=orderedPoints(r),key=currentMode+':'+r.id+':'+pts.map(p=>p.name).join('>');if(pathCache[key])return pathCache[key];let full=[];for(let i=0;i<pts.length-1;i++){let seg=await drivingSegment(pts[i],pts[i+1]);if(full.length)seg=seg.slice(1);full.push(...seg)}pathCache[key]=full.length>1?full:pts.map(p=>[p.lng,p.lat]);saveCaches();return pathCache[key]}function clearOverlays(){[...routeOverlays.values(),...markerOverlays.values()].flat().forEach(o=>map&&map.remove(o));routeOverlays.clear();markerOverlays.clear()}async function rebuildOverlays(){if(!map)return;clearOverlays();renderAll();let done=0;for(const r of routes()){await createRouteOverlay(r);setStatus(`已規劃 ${++done}/${routes().length} 條${mode().label}`)}fitVisible();setStatus('')}async function createRouteOverlay(r){let path=await buildPath(r),key=routeKey(r),halo=new AMap.Polyline({path,strokeColor:'#fff',strokeWeight:11,strokeOpacity:.72,zIndex:80}),line=new AMap.Polyline({path,strokeColor:r.color,strokeWeight:r.id===selectedRouteId?9:6,strokeOpacity:1,zIndex:90});line.on('click',()=>selectRoute(r.id,true));let ovs=[halo,line],ms=[];for(const s of r.stops){await geocodeStop(s);let m=new AMap.Marker({position:[s.lng,s.lat],anchor:'center',zIndex:120+r.id,content:`<div style="width:24px;height:24px;border-radius:999px;background:${r.color};border:3px solid #fff;display:grid;place-items:center;font-size:10px;font-weight:900;color:#06111f">${s.order}</div>`});m.on('mouseover',()=>showStop(r,s));m.on('click',()=>showStop(r,s));ms.push(m)}let e=r.stops.at(-1),lab=new AMap.Marker({position:[e.lng,e.lat],anchor:'bottom-left',zIndex:130,content:`<div class="bus-label">R${r.id} ${e.time}</div>`});ovs.push(lab);routeOverlays.set(key,ovs);markerOverlays.set(key,ms);if(visibleRoutes.has(key))map.add([...ovs,...ms])}function popupHtml(r,s){return `<div class="popup"><b>路線 ${r.id}｜${r.name}</b><br>${s.order}. ${s.name}<br>時間：${s.time||'時間待確認'}${s.fare?`<br>期費：${s.fare}`:''}${r.note?`<br>備註：${r.note}`:''}<br><span class="mode">${mode().label}</span></div>`}function showStop(r,s){selectRoute(r.id,false);infoWindow.setContent(popupHtml(r,s));infoWindow.open(map,[s.lng,s.lat])}function selectRoute(id,pan=false){selectedRouteId=id;renderAll();for(const r of routes()){let ovs=routeOverlays.get(routeKey(r))||[];ovs[1]?.setOptions({strokeWeight:r.id===id?9:6,zIndex:r.id===id?110:90});ovs[0]?.setOptions({strokeWeight:r.id===id?15:11})}if(pan)fitVisible([id])}function setRouteVisibility(r,vis){let k=routeKey(r);vis?visibleRoutes.add(k):visibleRoutes.delete(k);let all=[...(routeOverlays.get(k)||[]),...(markerOverlays.get(k)||[])];if(map)vis?map.add(all):map.remove(all);renderAll()}function allVisible(){return routes().every(r=>visibleRoutes.has(routeKey(r)))}function toggleAll(){let show=!allVisible();routes().forEach(r=>setRouteVisibility(r,show));fitVisible()}function fitVisible(ids=null){if(!map)return;let objs=[];routes().filter(r=>!ids||ids.includes(r.id)).forEach(r=>{if(visibleRoutes.has(routeKey(r))||ids)objs.push(...(routeOverlays.get(routeKey(r))||[]),...(markerOverlays.get(routeKey(r))||[]))});objs.length?map.setFitView(objs,false,[80,80,80,80]):map.setZoomAndCenter(14,[SCHOOL.lng,SCHOOL.lat])}function switchMode(m){currentMode=m;localStorage.setItem('schoolbus.mode',m);selectedRouteId=routes()[0].id;visibleRoutes=new Set(routes().map(r=>m+':'+r.id));rebuildOverlays()}
function renderRegionFilter(){let sel=$('regionFilter');if(!sel)return;const regions=[...new Set(routes().map(r=>r.region))];sel.innerHTML='<option value="all">全部區域</option>'+regions.map(r=>`<option value="${r}">${r}</option>`).join('');if(!regions.includes(currentRegion))currentRegion='all';sel.value=currentRegion}
function renderAll(){renderMode();renderRegionFilter();renderRouteList($('searchInput').value);renderLegend();renderDetail();renderTimeline();$('visibleCount').textContent=`${routes().filter(r=>visibleRoutes.has(routeKey(r))).length}/${routes().length} 已顯示`;$('toggleAllBtn').textContent=allVisible()?'清空全部路線':'顯示全部路線';$('modeText').textContent=`模式：${mode().label} · ${routes().length} 條路線`}function renderMode(){document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===currentMode))}function renderRouteList(q=''){q=q.trim().toLowerCase();$('routeList').innerHTML='';displayRoutes().forEach(r=>{let text=`${r.id} ${r.name} ${r.region} ${r.stops.map(s=>s.name+' '+s.time).join(' ')}`.toLowerCase();if(q&&!text.includes(q))return;let checked=visibleRoutes.has(routeKey(r))?'checked':'';$('routeList').insertAdjacentHTML('beforeend',`<div class="route-card ${selectedRouteId===r.id?'active':''} ${checked?'':'dimmed'}" data-route-id="${r.id}"><div class="route-head"><input class="route-check" type="checkbox" ${checked} data-route-check="${r.id}"><div class="route-name"><span class="dot" style="background:${r.color}"></span><span>路線 ${r.id}｜${r.name}${r.note?' · '+r.note:''}</span></div><b>${r.stops.length}站</b></div><div class="meta"><span>${r.stops[0].time} → ${r.stops.at(-1).time}</span><span>${r.region}</span></div></div>`)})}function renderLegend(){$('legend').innerHTML='';routes().forEach(r=>$('legend').insertAdjacentHTML('beforeend',`<div class="legend-item"><span class="dot" style="background:${r.color}"></span>R${r.id}</div>`))}function renderDetail(){let r=routes().find(x=>x.id===selectedRouteId)||routes()[0];$('detailHeader').innerHTML=`<div class="big-num" style="background:${r.color}">${r.id}</div><div><h2 style="margin:0">路線 ${r.id}｜${r.name}</h2><div class="subtitle">${mode().label} · ${r.stops[0].time} → ${r.stops.at(-1).time}${r.note?' · '+r.note:''}</div></div>`;$('stats').innerHTML=`<div class="stat"><b>${r.stops.length}</b><span>站點</span></div><div class="stat"><b>${visibleRoutes.has(routeKey(r))?'顯示中':'已隱藏'}</b><span>圖層</span></div><div class="stat"><b>${mode().direction}</b><span>方向</span></div>`;$('detailRouteNo').textContent=`路線${r.id}`;$('stopList').innerHTML='';r.stops.forEach(s=>$('stopList').insertAdjacentHTML('beforeend',`<div class="stop" data-stop-route="${r.id}" data-stop-order="${s.order}"><div class="idx" style="background:${r.color}">${s.order}</div><div class="time">${s.time}</div><div class="place">${s.name}${s.fare?`<br><span style="color:#9cb2d1;font-size:12px">${s.fare}</span>`:''}</div></div>`))}function renderTimeline(){let all=routes().flatMap(r=>r.stops.map(s=>s.time)),min=Math.min(...all.map(minutes)),max=Math.max(...all.map(minutes));$('timelineTitle').textContent=`時間軸總覽｜${mode().label}`;$('timebar').innerHTML='';for(let t=min;t<=max;t+=20){let pct=(t-min)/(max-min)*100;$('timebar').insertAdjacentHTML('beforeend',`<div class="tick" style="left:${pct}%"><span>${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</span></div>`)}routes().forEach((r,i)=>{let s=minutes(r.stops[0].time),e=minutes(r.stops.at(-1).time),left=(s-min)/(max-min)*100,w=Math.max(3,(e-s)/(max-min)*100);$('timebar').insertAdjacentHTML('beforeend',`<div class="route-chip ${visibleRoutes.has(routeKey(r))?'':'off'}" data-timeline-route="${r.id}" style="left:${left}%;width:${w}%;background:${r.color};top:${27+(i%2)*20}px"></div>`)})}
$('routeList').addEventListener('click',e=>{let chk=e.target.closest('[data-route-check]');if(chk){e.stopPropagation();let r=routes().find(x=>x.id===Number(chk.dataset.routeCheck));setRouteVisibility(r,chk.checked);return}let card=e.target.closest('[data-route-id]');if(card)selectRoute(Number(card.dataset.routeId),true)});$('stopList').addEventListener('mouseover',e=>{let row=e.target.closest('[data-stop-order]');if(!row||!map)return;let r=routes().find(x=>x.id===Number(row.dataset.stopRoute)),s=r.stops.find(x=>x.order===Number(row.dataset.stopOrder));if(s.lng)showStop(r,s)});$('searchInput').addEventListener('input',()=>renderRouteList($('searchInput').value));$('regionFilter').addEventListener('change',e=>{currentRegion=e.target.value;localStorage.setItem('schoolbus.region',currentRegion);let first=displayRoutes()[0]||routes()[0];selectedRouteId=first.id;renderAll();});$('toggleAllBtn').addEventListener('click',toggleAll);$('fitVisibleBtn').addEventListener('click',()=>fitVisible());$('focusSchoolBtn').addEventListener('click',()=>map&&map.setZoomAndCenter(15,[SCHOOL.lng,SCHOOL.lat]));$('timebar').addEventListener('click',e=>{let c=e.target.closest('[data-timeline-route]');if(c)selectRoute(Number(c.dataset.timelineRoute),true)});document.querySelectorAll('.mode-tab').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));$('saveAmapKeyBtn').addEventListener('click',()=>{let key=$('amapKeyInput').value.trim(),code=$('amapCodeInput').value.trim();if(!key)return alert('請先輸入高德 Web 端 Key');localStorage.setItem('schoolbus.amapKey',key);localStorage.setItem('schoolbus.amapCode',code);location.reload()});$('clearAmapKeyBtn').addEventListener('click',()=>{localStorage.removeItem('schoolbus.amapKey');localStorage.removeItem('schoolbus.amapCode');$('amapKeyInput').value='';$('amapCodeInput').value='';alert('已清除本機保存')});$('resetAmapKeyBtn').addEventListener('click',showKeyPanel);renderAll();loadAmap();
</script></body></html>
